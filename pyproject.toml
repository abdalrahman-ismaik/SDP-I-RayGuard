[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sdp-rayguard"
version = "0.1.0"
description = "CPU audit tools and shared interfaces for SDP-I-RayGuard"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow>=11,<13"]

[project.scripts]
sdp-xray = "sdp_xray.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdp_xray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
