name: CPU software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    name: CPU (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.15
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m pytest
      - run: uv run --locked python -m sdp_xray.cli doctor
      - run: uv run --locked python -m sdp_xray.cli audit-coco tests/fixtures/synthetic_coco.json
